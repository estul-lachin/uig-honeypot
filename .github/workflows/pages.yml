name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "vps/**", "siem/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Aggregator tests
        run: python3 -m unittest discover -s tests -v
      - name: Splunk macro matches the ATT&CK rules
        run: python3 siem/gen_splunk.py --check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # The page reads its data from the uig-honeypot-data repo, so only site/ is published.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
