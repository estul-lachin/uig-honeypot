name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "vps/**", "siem/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Aggregator tests
        run: python3 -m unittest discover -s tests -v
      - name: Splunk macro matches the ATT&CK rules
        run: python3 siem/gen_splunk.py --check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # reports.html only asks for the notes of weeks listed here.
      - name: Index the analyst notes
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          notes = pathlib.Path("site/notes")
          weeks = sorted(f.stem for f in notes.glob("*.md") if re.fullmatch(r"\d{4}-W\d{2}", f.stem))
          (notes / "index.json").write_text(json.dumps({"weeks": weeks}) + "\n")
          print(weeks)
          PY
      # The page reads its data from the uig-honeypot-data repo, so only site/ is published.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
