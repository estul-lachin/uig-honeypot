# Detections on the honeypot's own logs. Each runs hourly over the last 7 days
# of event time (./hp pull delivers logs in batches, so a short window would
# miss late events) and throttles per key, so one finding alerts once.
# Rationale, ATT&CK mapping and false positives: docs/detections.md.

[default]
enableSched = 1
cron_schedule = 7 * * * *
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
alert.track = 1
alert.digest_mode = 0
counttype = number of events
relation = greater than
quantity = 0
alert.suppress = 1
alert.suppress.period = 7d
request.ui_dispatch_app = honeypot
request.ui_dispatch_view = search

[HP-01 Login followed by tool download]
description = A session logs in and tries to download a tool within 5 minutes (T1078 then T1105): the dropper chain of most IoT/Linux botnets.
alert.severity = 4
alert.suppress.fields = session
search = index=honeypot sourcetype=cowrie:json eventid IN ("cowrie.login.success", "cowrie.command.input", "cowrie.session.file_download", "cowrie.session.file_download.failed") \
| `cowrie_ttp` \
| eval login_t=if(eventid=="cowrie.login.success", _time, null()), dl_t=if(isnotnull(mvfind(ttp, "^T1105$")), _time, null()), dl_cmd=if(isnotnull(dl_t) AND eventid=="cowrie.command.input", input, null()) \
| stats min(login_t) AS login_t min(dl_t) AS dl_t values(username) AS username values(password) AS password values(dl_cmd) AS download_command values(url) AS url by session src_ip \
| where isnotnull(login_t) AND isnotnull(dl_t) AND dl_t>=login_t AND dl_t-login_t<=300 \
| eval seconds_to_download=round(dl_t-login_t, 1), login_time=strftime(login_t, "%F %T"), download_commands=mvcount(download_command), download_command=mvindex(download_command, 0, 2) \
| table login_time session src_ip username password seconds_to_download download_commands download_command url

[HP-02 New download URL]
description = A download URL never seen before, from a command (wget/curl/tftp) or Cowrie's download event. Keeps first-seen state in the honeypot_seen_urls lookup.
alert.severity = 3
alert.suppress.fields = dl_url
search = index=honeypot sourcetype=cowrie:json eventid IN ("cowrie.command.input", "cowrie.session.file_download", "cowrie.session.file_download.failed") \
| rex field=input max_match=5 "(?<cmd_url>(?:https?|ftp|tftp)://[^\s;|'\"<>]+)" \
| eval dl_url=mvdedup(mvappend(cmd_url, url)) \
| mvexpand dl_url \
| where len(dl_url)>0 \
| stats min(_time) AS first_seen max(_time) AS last_seen count dc(src_ip) AS sources by dl_url \
| eval is_new=1 \
| append [| inputlookup honeypot_seen_urls | eval is_new=0] \
| stats min(first_seen) AS first_seen max(last_seen) AS last_seen max(count) AS count max(sources) AS sources min(is_new) AS is_new by dl_url \
| outputlookup honeypot_seen_urls \
| where is_new=1 \
| eval first_seen=strftime(first_seen, "%F %T") \
| table first_seen dl_url sources count

[HP-03 Shared wordlist across sources]
description = Three or more source IPs try the same set of passwords within an hour (T1110): one botnet campaign spread over many hosts, invisible to per-IP thresholds.
alert.severity = 3
alert.suppress.fields = wordlist
search = index=honeypot sourcetype=cowrie:json eventid IN ("cowrie.login.failed", "cowrie.login.success") \
| bin _time span=1h \
| stats values(password) AS passwords dc(password) AS n by _time src_ip \
| where n>=3 \
| eval wordlist=md5(mvjoin(mvsort(passwords), "|")) \
| stats dc(src_ip) AS sources values(src_ip) AS src_ips values(passwords) AS passwords by _time wordlist n \
| where sources>=3 \
| eval hour=strftime(_time, "%F %H:00") \
| table hour wordlist n sources src_ips passwords

[HP-04 Persistence attempt]
description = Commands that add SSH keys, cron jobs or change account passwords (T1098.004, T1053.003, T1098): the attacker wants to come back.
alert.severity = 4
alert.suppress.fields = session
search = index=honeypot sourcetype=cowrie:json eventid="cowrie.command.input" \
| `cowrie_ttp` \
| where isnotnull(mvfind(ttp, "^(T1098\.004|T1053\.003|T1098)$")) \
| lookup ttp_rules id AS ttp OUTPUT name AS technique \
| table _time session src_ip ttp technique input

[HP-05 Crypto miner]
description = Miner binaries, pool protocols or coin names in commands (T1496, Resource Hijacking).
alert.severity = 4
alert.suppress.fields = session
search = index=honeypot sourcetype=cowrie:json eventid="cowrie.command.input" \
| `cowrie_ttp` \
| where isnotnull(mvfind(ttp, "^T1496$")) \
| rex field=input "(?i)(?<pool>stratum\+(?:tcp|ssl)://[^\s;|'\"]+)" \
| table _time session src_ip pool input

[HP-06 Returning source]
description = A source IP connects again after more than 7 days of silence: a persistent scanner or a bot that keeps a target list.
alert.severity = 2
alert.suppress.fields = src_ip
dispatch.earliest_time = -30d@d
cron_schedule = 17 6 * * *
search = index=honeypot sourcetype=cowrie:json eventid="cowrie.session.connect" \
| bin _time span=1d \
| stats count AS sessions by src_ip _time \
| sort 0 src_ip _time \
| streamstats current=f window=1 last(_time) AS previous by src_ip \
| where _time-previous > 7*86400 \
| eval gap_days=round((_time-previous)/86400), day=strftime(_time, "%F"), previous=strftime(previous, "%F") \
| table day src_ip previous gap_days sessions

[HP-07 Unknown source got a shell]
description = A source with no AbuseIPDB reports logged in and ran commands: fresh attack infrastructure, not yet on blocklists. The most valuable IOC a honeypot produces.
alert.severity = 3
alert.suppress.fields = src_ip
search = index=honeypot sourcetype=cowrie:json eventid IN ("cowrie.login.success", "cowrie.command.input") \
| stats count(eval(eventid=="cowrie.command.input")) AS commands values(session) AS sessions min(_time) AS first_seen by src_ip abuse_reports abuse_score abuse_isp abuse_usage_type \
| where abuse_reports=0 AND commands>0 \
| eval first_seen=strftime(first_seen, "%F %T"), sessions=mvcount(sessions) \
| table first_seen src_ip abuse_isp abuse_usage_type sessions commands
