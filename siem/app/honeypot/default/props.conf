[cowrie:json]
# One JSON object per line, e.g. {"eventid":"cowrie.login.failed","timestamp":"2026-11-08T16:58:13.813303Z",...}
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
TIME_PREFIX = "timestamp":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N
MAX_TIMESTAMP_LOOKAHEAD = 32
TZ = UTC
KV_MODE = json
# CIM-style names, so standard authentication searches (src, user, action) work too
FIELDALIAS-cim = src_ip AS src, username AS user
EVAL-action = case(eventid=="cowrie.login.success", "success", eventid=="cowrie.login.failed", "failure")
