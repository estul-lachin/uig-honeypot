# ./hp pull copies cowrie.json and its rotated files (cowrie.json.YYYY-MM-DD)
# into logs/, mounted read-only here. Splunk recognizes a rotated file by the
# CRC of its first bytes, so a day is never indexed twice. No crcSalt.
[monitor:///opt/honeypot-logs]
index = honeypot
sourcetype = cowrie:json
whitelist = cowrie\.json(\.\d{4}-\d{2}-\d{2})?$
disabled = 0
