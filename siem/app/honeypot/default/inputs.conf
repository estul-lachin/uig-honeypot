# ./hp pull copies cowrie.json and its rotated files (cowrie.json.YYYY-MM-DD)
# into logs/, mounted read-only here. Splunk recognizes a rotated file by the
# CRC of its first bytes, so a day is never indexed twice. No crcSalt.
[monitor:///opt/honeypot-logs]
index = honeypot
sourcetype = cowrie:json
whitelist = cowrie\.json(\.\d{4}-\d{2}-\d{2})?$
disabled = 0

# ./hp demo writes the pseudonymized copy (siem/pseudo.py), one file per day and source, with exactly
# the columns of Cowrie_CL / Suricata_CL. Recordings and guide.uig.me use only this index.
[monitor:///opt/honeypot-demo/cowrie-*.json]
index = honeypot_demo
sourcetype = cowrie:json
disabled = 0

[monitor:///opt/honeypot-demo/suricata-*.json]
index = honeypot_demo
sourcetype = suricata:alert
disabled = 0
